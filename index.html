<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Income Tracker</title><style>
:root{color-scheme:dark;--bg:#0b1020;--card:#121a2e;--line:#26314b;--text:#f5f7ff;--muted:#9ca8c4;--accent:#55e6a5;--danger:#ff6b7a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}.app{max-width:680px;margin:auto;padding:22px 16px 40px}.hero{padding:8px 2px 18px}.hero h1{font-size:28px;margin:0 0 6px}.hero p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.label{color:var(--muted);font-size:13px}.value{font-size:25px;font-weight:800;margin-top:5px}.accent{color:var(--accent)}.wide{margin-top:10px}.bar{height:12px;background:#202a43;border-radius:99px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:var(--accent);transition:.2s}.form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}.form input,.form button{border-radius:12px;border:1px solid var(--line);padding:13px;font-size:16px}.form input{background:#0e1527;color:var(--text)}button{background:var(--accent);color:#07130d;font-weight:800;cursor:pointer}.table{margin-top:14px}.row{display:grid;grid-template-columns:1fr 100px 44px;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row span:nth-child(2){text-align:right;font-weight:700}.del{background:transparent;color:var(--danger);border:0;padding:5px}.empty{color:var(--muted);text-align:center;padding:22px}.reset{margin-top:14px;background:transparent;color:var(--muted);width:100%}@media(max-width:430px){.value{font-size:22px}.row{grid-template-columns:1fr 82px 38px}}
</style></head><body><main class="app"><section class="hero"><h1>💰 Daily Income Tracker</h1><p>১ বছরে $5,000 টার্গেট — প্রতিদিনের আয় লিখে রাখুন</p></section><section class="grid"><div class="card"><div class="label">বার্ষিক টার্গেট</div><div class="value">$5,000.00</div></div><div class="card"><div class="label">দৈনিক গড় লক্ষ্য</div><div class="value accent">$13.70</div></div><div class="card"><div class="label">মোট আয়</div><div class="value" id="total">$0.00</div></div><div class="card"><div class="label">বাকি</div><div class="value" id="left">$5,000.00</div></div></section><section class="card wide"><div class="label">টার্গেট অগ্রগতি <span id="pct">0%</span></div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card wide"><div class="label">আজকের আয় ($)</div><div class="form"><input id="amount" type="number" min="0" step="0.01" placeholder="যেমন 13.70"><button id="add">যোগ করুন</button></div></section><section class="card wide table"><div class="label">আয়ের হিসাব</div><div id="list" class="empty">এখনো কোনো আয় যোগ করা হয়নি।</div></section><button class="reset" id="reset">সব হিসাব মুছে ফেলুন</button></main><script>
const KEY='parvez_daily_income_v1', TARGET=5000;let data=JSON.parse(localStorage.getItem(KEY)||'[]');
function money(n){return '$'+Number(n).toFixed(2)}function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function render(){let total=data.reduce((s,x)=>s+x.amount,0),left=Math.max(0,TARGET-total),pct=Math.min(100,total/TARGET*100);document.querySelector('#total').textContent=money(total);document.querySelector('#left').textContent=money(left);document.querySelector('#pct').textContent=pct.toFixed(1)+'%';document.querySelector('#fill').style.width=pct+'%';let list=document.querySelector('#list');if(!data.length){list.className='empty';list.textContent='এখনো কোনো আয় যোগ করা হয়নি।';return}list.className='';list.innerHTML=data.slice().reverse().map((x,i)=>`<div class="row"><span>${x.date}</span><span>${money(x.amount)}</span><button class="del" data-i="${data.length-1-i}">✕</button></div>`).join('');document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{data.splice(+b.dataset.i,1);save()})}
document.querySelector('#add').onclick=()=>{let v=parseFloat(document.querySelector('#amount').value);if(!isFinite(v)||v<0)return;data.push({date:new Date().toLocaleDateString('bn-BD'),amount:v});document.querySelector('#amount').value='';save()};document.querySelector('#amount').onkeydown=e=>{if(e.key==='Enter')document.querySelector('#add').click()};document.querySelector('#reset').onclick=()=>{if(confirm('সব হিসাব মুছে ফেলবেন?')){data=[];save()}};render();
</script></body></html>
